[default.extend-words]
PNGs = "PNGs"
PN = "PN"
mappin = "mappin"

# Locale files contain German, French, Spanish — not English typos
[type.json]
extend-glob = []
check-file = false

# Screenshot baselines are binary PNGs — random bytes trigger false positives
[type.png]
extend-glob = ["*.png"]
check-file = false

[files]
extend-exclude = [
    "**/assets/locales/*.json",
    "**/local-bindings/**",
]
