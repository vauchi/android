# GitLab CI for vauchi-android
#
# Android app (Kotlin/Compose)
#
# Native bindings:
#   Consumed from vauchi-platform-kotlin via GitLab Maven registry.
#   The vauchi/core release pipeline builds UniFFI bindings, packages them,
#   and triggers vauchi-platform-kotlin to publish an AAR to Maven.
#
# Performance optimizations:
#   - Change-based rules: Jobs run only when relevant files change
#   - Timeouts: Prevent runaway jobs from blocking runners
#   - Interruptible: Auto-cancel on new commits
#
# Pipeline strategy:
#   - MR: Full validation (lint, build, test, security)
#   - Tag: Release build + Play Store internal testing upload
#   - Scheduled: Security scans
#   Main branch is protected and merge-only. All validation happens
#   during the MR pipeline; post-merge pipelines are unnecessary.
#
# GitLab Ultimate Features:
#   - SAST: Static application security testing (Android)
#   - Dependency Scanning: Gradle dependency scanning (gemnasium)
#   - Secret Detection: Prevent credential leaks

# GitLab Ultimate Templates + shared timeout definitions
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - project: 'vauchi/scripts'
    # main, not a ci-templates tag: presentation-mode design-drift /
    # parser-parity support is merged but not yet tagged (checked
    # 2026-07-30, ci-templates-v2026.07.11 lacks DESIGN_DRIFT_PROTOCOL).
    ref: main
    file:
      - '/ci-templates/timeouts.yml'
      - '/ci-templates/reuse.yml'
      - '/ci-templates/design-drift.yml'
      - '/ci-templates/image-lint.yml'
      - '/ci-templates/orphan-baselines.yml'
      - '/ci-templates/parser-parity.yml'
      - '/ci-templates/removed-symbols.yml'
      - '/ci-templates/badges.yml'
      - '/ci-templates/github-mirror.yml'
      - '/ci-templates/vrt-upload.yml'
      - '/ci-templates/perf.yml'

# Stub anchor required by perf.yml templates (defined in rust-base.yml for Rust repos)
.self-hosted:
  before_script:
    - export PATH="$HOME/.cargo/bin:${PATH}"

stages:
  - auto-tag
  - update
  - lint
  - build
  - test
  - security
  - deploy

variables:
  VAUCHI_SCRIPTS_REF: "5f6614ba3de5f462978d5222b682c27d2dfe8d3a"
  ANDROID_COMPILE_SDK: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  GIT_DEPTH: "1"
  # Gradle performance flags for self-hosted runner with persistent disk
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=true
    -Dorg.gradle.caching=true
    -Dorg.gradle.parallel=true
    -Dorg.gradle.jvmargs=-Xmx4g

  # GitLab Ultimate Security Configuration
  SAST_EXCLUDED_PATHS: "build/, .gradle/"
  DS_EXCLUDED_PATHS: "build/, .gradle/"
  SECRET_DETECTION_EXCLUDED_PATHS: "build/, .gradle/"

  # Exclude gemnasium-maven analyzer — Gradle is covered by gemnasium.
  # The maven analyzer fails on test-only Compose dependencies that are
  # not fully resolvable outside Android SDK (ui-tooling, ui-test-manifest).
  DS_EXCLUDED_ANALYZERS: "gemnasium-maven"

  # Enable Android-specific SAST analyzers
  SAST_ANALYZER_IMAGE_TAG: "5"

# Interruptible default for auto-cancel
default:
  interruptible: true

workflow:
  auto_cancel:
    on_new_commit: interruptible

.gradle-cache:
  cache: &gradle-cache
    key: ${CI_COMMIT_REF_SLUG}-gradle
    fallback_keys:
      - ${CI_DEFAULT_BRANCH}-gradle
      - gradle
    paths:
      - .gradle/
      - ~/.gradle/caches/
      - ~/.gradle/wrapper/

.android-job:
  tags: [linux, self-hosted]
  variables:
    ANDROID_HOME: /opt/android-sdk
  cache: {}  # No GitLab cache — self-hosted runner has persistent ~/.gradle
  before_script:
    # Gradle auto-installs missing SDK packages, but only when the SDK
    # licenses are accepted. The self-hosted runner's /opt/android-sdk is
    # read-only for the runner user, ships no sdkmanager, and is missing
    # packages (2026-07-30: build-tools;36.0.0 and platforms;android-35
    # installs refused — verified in pipelines 2717839043/2720166012).
    # Work around it with a writable overlay in the runner user's $HOME:
    # real per-category dirs (so Gradle can install missing packages into
    # them) whose existing contents are symlinks into the read-only SDK,
    # plus the license marker files `sdkmanager --licenses` would have
    # written (hashes verified against a real SDK install). The overlay
    # persists on the runner, so package downloads happen once. If it
    # cannot be built, ANDROID_HOME stays put and the build fails exactly
    # as before, never worse.
    - |
      SDK_SRC="$ANDROID_HOME"
      SDK_WR="$HOME/.vauchi-android-sdk"
      if [ -d "$SDK_SRC" ] && mkdir -p "$SDK_WR"; then
        for entry in "$SDK_SRC"/*; do
          base=$(basename "$entry")
          if [ ! -d "$entry" ]; then
            [ -e "$SDK_WR/$base" ] || ln -s "$entry" "$SDK_WR/$base"
            continue
          fi
          [ "$base" = "licenses" ] && continue
          mkdir -p "$SDK_WR/$base"
          for pkg in "$entry"/*; do
            p=$(basename "$pkg")
            [ -e "$SDK_WR/$base/$p" ] || ln -s "$pkg" "$SDK_WR/$base/$p"
          done
        done
        mkdir -p "$SDK_WR/licenses"
        printf '%s\n' \
          24333f8a63b6825ea9c5514f83c2829b004d1fee \
          8933bad161af4178b1185d1a37fbf41ea5269c55 \
          d56f5187479451eabf01fb78af6dfcb131a6481e \
          > "$SDK_WR/licenses/android-sdk-license"
        echo "84831b9409646a918e30573bab4c9c91346d8abd" \
          > "$SDK_WR/licenses/android-sdk-preview-license"
        export ANDROID_HOME="$SDK_WR"
        export ANDROID_SDK_ROOT="$SDK_WR"
        echo "✅ Using writable SDK overlay at $SDK_WR (licenses accepted)"
      else
        echo "⚠️  Cannot build SDK overlay — using $SDK_SRC as-is"
      fi
    # AGP's JdkImageTransform shells out to jlink from the JVM running
    # Gradle. The runner's /usr/lib/jvm/java-26-jdk jlink fails
    # deterministically (build:debug, pipelines 2720166012/2720212818)
    # while the same build passes on JDK 17. Self-test jlink so the
    # failure mode is visible in the trace, and if it is broken, fall
    # back to a stable JDK (17/21) when the runner has one.
    - |
      JAVA_BIN=$(readlink -f "$(command -v java)" 2>/dev/null || true)
      JLINK="${JAVA_BIN%/bin/java}/bin/jlink"
      if [ -x "$JLINK" ]; then
        SELFTEST="/tmp/jlink-selftest-${CI_JOB_ID:-local}"
        if "$JLINK" --module-path "${JLINK%/bin/jlink}/../jmods" \
             --add-modules java.base --output "$SELFTEST" \
             --disable-plugin system-modules 2>&1; then
          echo "✅ jlink self-test OK ($JLINK)"
        else
          echo "⚠️  jlink self-test FAILED ($JLINK) — output above"
          for jdk in /usr/lib/jvm/*17* /usr/lib/jvm/*21*; do
            if [ -x "$jdk/bin/java" ] && [ -x "$jdk/bin/jlink" ]; then
              grep -q "^org.gradle.java.home=" gradle.properties \
                || echo "org.gradle.java.home=$jdk" >> gradle.properties
              export JAVA_HOME="$jdk"
              echo "✅ Falling back to JDK at $jdk"
              break
            fi
          done
        fi
        rm -rf "$SELFTEST"
      fi

.android-docker-job:
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/cimg/android:2025.01
  # Route to the self-hosted docker executor (allyson-docker). Without an
  # explicit tag this job is untagged, and since shared runners are disabled
  # and every self-hosted runner has run_untagged=false, the only consumers
  # (build:release, deploy:internal) would sit pending forever with no
  # eligible runner — which is why no release pipeline had ever gone green.
  tags: [docker, self-hosted]
  cache:
    <<: *gradle-cache

# Timeout templates provided by vauchi/scripts ci-templates/timeouts.yml

# ============================================================
# Auto-Tag Stage
# ============================================================

# When versionName is bumped and merged to main,
# automatically create a v{version} tag to trigger the release pipeline.
auto-tag:version:
  stage: auto-tag
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  resource_group: auto-tag
  needs: []
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "1"
  script:
    - apk add --no-cache git
    - |
      VERSION=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)"/\1/')
      TAG="v${VERSION}"
      echo "build.gradle.kts versionName: ${VERSION}"
      echo "Expected tag: ${TAG}"

      # Check if tag already exists
      if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
        echo "✓ Tag ${TAG} already exists — nothing to do"
        exit 0
      fi

      echo "Tag ${TAG} does not exist — creating it..."

      # NOTE: GITLAB_USER_EMAIL is safe here — auto-tag runs on same-repo
      # push (user's own email is verified). Cross-repo triggers use the
      # API-discovered bot email in update:bindings-version instead.
      git config user.name "${GITLAB_USER_NAME}"
      git config user.email "${GITLAB_USER_EMAIL}"

      # Use project access token for push — CI_JOB_TOKEN cannot be used here
      # because pushes via CI_JOB_TOKEN do not trigger new pipelines, and the
      # tag push must trigger the release pipeline (build:release stage).
      # PROJECT_ACCESS_TOKEN is set at group level in Settings > CI/CD > Variables.
      git remote set-url origin "https://vauchi-gitlab-runner:${PROJECT_ACCESS_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"

      git tag -a "${TAG}" -m "Release ${TAG}"
      git push origin "${TAG}"
      echo "✓ Created and pushed tag ${TAG}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"

# ============================================================
# Update Stage (triggered by upstream distribution repo)
# ============================================================

# Automatically bump vauchi-platform dependency and create MR
update:bindings-version:
  stage: update
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  rules:
    - if: ($CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "api") && $BINDINGS_VERSION
  script:
    - apk add --no-cache git curl jq sed
    - |
      # Strip v prefix if present (upstream trigger passes v0.1.16 format)
      BINDINGS_VERSION="${BINDINGS_VERSION#v}"
      echo "Bumping vauchi-platform to $BINDINGS_VERSION"

      BRANCH="chore/bump-vauchi-platform-${BINDINGS_VERSION}"
      BUILD_FILE="app/build.gradle.kts"

      # Configure git — use PROJECT_ACCESS_TOKEN for push (CI_JOB_TOKEN from
      # upstream triggers lacks write access to this repo).
      # PROJECT_ACCESS_TOKEN is set at group level in Settings > CI/CD > Variables.
      # Look up the bot's own email via API — PROJECT_ACCESS_TOKEN belongs
      # to a group bot whose noreply email is verified by GitLab. Using
      # GITLAB_USER_EMAIL fails when a human triggers the upstream pipeline.
      BOT_USER=$(curl -fsSL --header "PRIVATE-TOKEN: ${PROJECT_ACCESS_TOKEN}" \
        "${CI_SERVER_URL}/api/v4/user")
      BOT_EMAIL=$(echo "$BOT_USER" | jq -r '.commit_email // .email')
      BOT_NAME=$(echo "$BOT_USER" | jq -r '.name // "Vauchi CI"')
      git config user.email "$BOT_EMAIL"
      git config user.name "$BOT_NAME"
      git remote set-url origin "https://vauchi-gitlab-runner:${PROJECT_ACCESS_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"

      # Check if branch already exists on remote
      if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
        echo "Branch $BRANCH already exists — version bump already in progress"
        exit 0
      fi

      # Check if already at target version
      OLD_VERSION=$(grep -oE 'app\.vauchi:vauchi-platform:[^"]+' "$BUILD_FILE" | head -1 | cut -d: -f3)
      echo "Old version: $OLD_VERSION → New version: $BINDINGS_VERSION"
      if [ "$OLD_VERSION" = "$BINDINGS_VERSION" ]; then
        echo "Already at $BINDINGS_VERSION — nothing to do"
        exit 0
      fi

      # Create branch and update version (-B force-creates if stale
      # local branch exists from a previous failed pipeline retry)
      git checkout -B "$BRANCH"
      sed -i "s|app\.vauchi:vauchi-platform:[^\"]*|app.vauchi:vauchi-platform:${BINDINGS_VERSION}|g" "$BUILD_FILE"

      # Verify the change was made
      if ! grep -q "app.vauchi:vauchi-platform:${BINDINGS_VERSION}" "$BUILD_FILE"; then
        echo "ERROR: Version replacement failed"
        exit 1
      fi

      git add "$BUILD_FILE"
      git commit -m "chore: Bump vauchi-platform to $BINDINGS_VERSION"
      git push -u origin "$BRANCH"

      # Create MR via GitLab API
      MR_RESPONSE=$(curl -s --request POST \
        --header "PRIVATE-TOKEN: ${PROJECT_ACCESS_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "{
          \"source_branch\": \"$BRANCH\",
          \"target_branch\": \"main\",
          \"title\": \"chore: Bump vauchi-platform to $BINDINGS_VERSION\",
          \"description\": \"Automated version bump triggered by vauchi-platform-kotlin release.\\n\\nUpdates \`app.vauchi:vauchi-platform\` from current version to \`$BINDINGS_VERSION\`.\\n\\n---\\n_This MR was created automatically by CI._\",
          \"remove_source_branch\": true
        }" \
        "${CI_SERVER_URL}/api/v4/projects/${CI_PROJECT_ID}/merge_requests")

      MR_IID=$(echo "$MR_RESPONSE" | jq -r '.iid // empty')
      MR_URL=$(echo "$MR_RESPONSE" | jq -r '.web_url // empty')
      if [ -n "$MR_URL" ] && [ -n "$MR_IID" ]; then
        echo "Created MR: $MR_URL"

        # Enable auto-merge so the MR merges automatically when CI passes
        echo "Enabling auto-merge..."
        MERGE_RESPONSE=$(curl -s --request PUT \
          --header "PRIVATE-TOKEN: ${PROJECT_ACCESS_TOKEN}" \
          "${CI_SERVER_URL}/api/v4/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}/merge?merge_when_pipeline_succeeds=true")
        MERGE_STATUS=$(echo "$MERGE_RESPONSE" | jq -r '.merge_when_pipeline_succeeds // empty')
        if [ "$MERGE_STATUS" = "true" ]; then
          echo "Auto-merge enabled — MR will merge when pipeline succeeds"
        else
          echo "WARNING: Could not enable auto-merge (may require maintainer token)"
          echo "  Response: $(echo "$MERGE_RESPONSE" | jq -r '.message // .error // "unknown"')"
        fi
      else
        echo "MR creation response: $MR_RESPONSE"
        echo "WARNING: Could not create MR (may already exist)"
      fi

# ============================================================
# Lint Stage (MR + main, change-based)
# ============================================================

# Combined blocking cross-cutting checks. Replaces docs:gate,
# lint:locale-key-coverage, lint:no-hardcoded-strings and lint:humble.
# Checks run sequentially; any failure fails the bundle.
lint:cross-cutting-blocking:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.11-slim
  tags: [docker]
  needs: []
  allow_failure: false
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends bash ripgrep jq git findutils curl ca-certificates
    - mkdir -p .ratchet-scripts
    - |
      curl --silent --fail \
        "${CI_API_V4_URL}/projects/vauchi%2Fscripts/repository/files/scripts%2Fhumble_check.py/raw?ref=${VAUCHI_SCRIPTS_REF}" \
        -o .ratchet-scripts/humble_check.py
      curl --silent --fail \
        "${CI_API_V4_URL}/projects/vauchi%2Fscripts/repository/files/scripts%2Fhumble_check_rules.json/raw?ref=${VAUCHI_SCRIPTS_REF}" \
        -o .ratchet-scripts/humble_check_rules.json
      curl --silent --fail \
        "${CI_API_V4_URL}/projects/vauchi%2Fscripts/repository/files/scripts%2Fhumble_check.baseline.json/raw?ref=${VAUCHI_SCRIPTS_REF}" \
        -o .ratchet-scripts/humble_check.baseline.json
    # View-layer pure-renderer lints (same set iOS runs in
    # check:humble-ui-ratchets + the android-only domain-imports fence).
    # Fetched from vauchi/scripts at the pinned ref; each exits non-zero
    # on violation.
    - |
      for script in \
          check-no-isimported-in-views.sh \
          check-no-domain-conditionals-in-views.sh \
          check-no-direct-clipboard-writes.sh \
          check-no-domain-imports-in-views.sh; do
        curl --silent --fail \
          "${CI_API_V4_URL}/projects/vauchi%2Fscripts/repository/files/scripts%2F${script}/raw?ref=${VAUCHI_SCRIPTS_REF}" \
          -o ".ratchet-scripts/${script}"
        chmod +x ".ratchet-scripts/${script}"
      done
    # Always pull the latest locales/main. GitLab runners can preserve
    # `../locales` across job retries on the same machine, and a stale
    # clone causes the gate to fire on keys the current
    # `vauchi/locales` main has already shipped.
    - |
      if [ -d ../locales ]; then
        git -C ../locales fetch --depth=1 origin main
        git -C ../locales reset --hard origin/main
      else
        git clone --depth=1 https://gitlab.com/vauchi/locales.git ../locales
      fi
  script:
    - echo "=== Cross-cutting blocking lint checks ==="
    - bash ../locales/scripts/check-locale-key-coverage.sh
        app/src/main ../locales '*.kt'
    - bash scripts/check-no-hardcoded-strings.sh
        app/src/main/kotlin/app/vauchi
    - python3 .ratchet-scripts/humble_check.py --repo "${CI_PROJECT_NAME}" --repo-path "${CI_PROJECT_DIR}" --config .ratchet-scripts/humble_check_rules.json --check .ratchet-scripts/humble_check.baseline.json
    # View-layer pure-renderer lints (previously local-only via
    # `just lint android`; promoted to blocking 2026-07-18).
    - .ratchet-scripts/check-no-isimported-in-views.sh "${CI_PROJECT_DIR}"
    - .ratchet-scripts/check-no-domain-conditionals-in-views.sh "${CI_PROJECT_DIR}"
    - .ratchet-scripts/check-no-direct-clipboard-writes.sh "${CI_PROJECT_DIR}"
    - .ratchet-scripts/check-no-domain-imports-in-views.sh "${CI_PROJECT_DIR}" --strict
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

lint:images:
  extends: .image-lint

# Design drift: verify all design-spec components are implemented
check:design-drift:
  extends: .design-drift-job
  variables:
    DESIGN_DRIFT_PROTOCOL: "presentation"
    DESIGN_DRIFT_MATCH_MODE: "grep"
    DESIGN_DRIFT_GREP_FILE: "app/src/main/kotlin/app/vauchi/ui/presentation"
    # Pin to the core tag that produced the vauchi-platform AAR pinned in
    # app/build.gradle.kts — the same ref test:screenshots derives from the
    # AAR version — so drift is checked against exactly the shipped core.
    CORE_REF: "v0.59.0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "app/src/main/kotlin/app/vauchi/ui/presentation/**"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - "app/src/main/kotlin/app/vauchi/ui/presentation/**"
          - ".gitlab-ci.yml"

# Parser-parity gate for Core's canonical PresentationNode enum.
check:parser-parity:
  extends: .parser-parity-job
  variables:
    FRONTEND_NAME: "android"
    PARSER_FILE: "app/src/main/kotlin/app/vauchi/ui/presentation/PresentationParser.kt"
    PARSER_PROTOCOL: "presentation"
    PARSER_SCRIPT_REF: "main"
    CORE_REF: "main"

# Removed symbols: detect stale references to removed features
check:removed-symbols:
  extends: .removed-symbols-job
  variables:
    SEARCH_DIRS: "app/src/"

# Design token drift: warn on hardcoded dp/colors that bypass tokens.json.
# Script lives in vauchi/scripts — fetched via API to avoid duplicating it here.
# allow_failure: true makes this a visibility gate, not a merge blocker.
check:design-tokens:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  allow_failure: true
  before_script:
    - apk add --no-cache bash findutils grep curl
  script:
    - |
      curl --silent --fail \
        "${CI_API_V4_URL}/projects/vauchi%2Fscripts/repository/files/scripts%2Fcheck-design-tokens.sh/raw?ref=${VAUCHI_SCRIPTS_REF}" \
        -o check-design-tokens.sh
      chmod +x check-design-tokens.sh
    - ./check-design-tokens.sh app/src/main/kotlin/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/main
        paths:
          - "**/*.kt"
          - ".gitlab-ci.yml"

lint:no-proprietary-deps:
  extends: [.android-job]
  stage: lint
  needs: []
  script:
    - |
      echo "=== No Proprietary Dependencies Check ==="
      # ML Kit removed — replaced by rxing via UniFFI.
      # ZXing (com.google.zxing:core) is kept for QR generation — it's a
      # standalone Apache-2.0 library, no Google Play Services dependency.
      # It will be replaced by core's qrcode crate via UniFFI in a future release.
      DEPS=$(./gradlew app:dependencies --configuration releaseRuntimeClasspath 2>/dev/null || true)
      # ZXing is allowed (standalone, no GMS); filter it before checking
      FILTERED=$(echo "$DEPS" | grep -v "com.google.zxing")
      FORBIDDEN_PATTERNS="com.google.firebase|com.google.android.gms|play-services|com.google.mlkit"
      if echo "$FILTERED" | grep -E "$FORBIDDEN_PATTERNS"; then
        echo ""
        echo "✗ FAIL: Found Google Play Services, Firebase, or ML Kit dependency"
        echo "  Vauchi must work on de-Googled Android (no GMS runtime)."
        exit 1
      fi
      echo "✓ No proprietary runtime dependencies found (ZXing allowed, no GMS)"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/main
        paths:
          - "app/build.gradle*"
          - "build.gradle*"
          - "gradle/libs.versions.toml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================
# Build Stage (MR: debug + lint, Tag: release)
# ============================================================

build:debug:
  extends: [.android-job, .timeout-standard]
  stage: build
  needs: []
  script:
    - ./gradlew assembleDebug lint
  artifacts:
    paths:
      - app/build/outputs/apk/debug/
      - app/build/reports/lint-results-*.html
    reports:
      codequality: app/build/reports/lint-results-debug.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/main
        paths:
          - "**/*.kt"
          - "**/*.java"
          - "**/*.xml"
          - "build.gradle*"
          - "app/build.gradle*"
          - ".gitlab-ci.yml"

build:release:
  extends: [.android-docker-job, .timeout-long]
  stage: build
  # Required CI/CD variables (Settings > CI/CD > Variables, protected + masked):
  #   ANDROID_KEYSTORE          - Base64-encoded upload keystore (.jks)
  #   ANDROID_KEYSTORE_PASSWORD - Keystore password
  #   ANDROID_KEY_ALIAS         - Key alias within keystore
  #   ANDROID_KEY_PASSWORD      - Key password
  script:
    # Decode and validate signing keystore
    - echo "$ANDROID_KEYSTORE" | base64 -d > /tmp/vauchi-upload.jks
    - '[ -s /tmp/vauchi-upload.jks ] || { echo "ERROR: ANDROID_KEYSTORE is empty or invalid"; exit 1; }'
    - export ANDROID_KEYSTORE_PATH=/tmp/vauchi-upload.jks
    - ./gradlew bundleRelease
  after_script:
    - rm -f /tmp/vauchi-upload.jks
  artifacts:
    paths:
      - app/build/outputs/bundle/release/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ============================================================
# Test Stage (MR only, change-based)
# ============================================================

test:unit:
  extends: [.android-job, .timeout-standard]
  stage: test
  needs:
    - job: build:debug
      artifacts: false  # Build cache on persistent disk handles reuse, not artifacts
  script:
    - ./gradlew test
  artifacts:
    reports:
      junit: app/build/test-results/**/TEST-*.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/main
        paths:
          - "**/*.kt"
          - "**/*.java"
          - "build.gradle*"
          - "app/build.gradle*"
          - ".gitlab-ci.yml"

coverage:unit:
  extends: [.android-job, .timeout-standard]
  stage: test
  script:
    - ./gradlew jacocoDebugTestReport
    - |
      curl --silent --fail \
        "${CI_API_V4_URL}/projects/vauchi%2Fscripts/repository/files/scripts%2Fci%2Fpush-coverage.sh/raw?ref=${VAUCHI_SCRIPTS_REF}" \
        -o push-coverage.sh
      chmod +x push-coverage.sh
    - ./push-coverage.sh app/build/reports/jacoco/jacocoDebugTestReport/jacocoDebugTestReport.xml android || true
  coverage: '/Line Coverage:\s+(\d+(?:\.\d+)?%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: app/build/reports/jacoco/jacocoDebugTestReport/jacocoDebugTestReport.xml
    paths:
      - app/build/reports/jacoco/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

test:screenshots:
  extends: [.android-job, .timeout-standard]
  stage: test
  needs: []
  # Host .so built from core tag matching AAR version (v0.12.2).
  # Falls back to main if tag missing — verify tags exist before bumping AAR.
  variables:
    VRT_PLATFORM: android
    VRT_SCREENSHOT_DIR: app/src/screenshotTestDebug/reference/app/vauchi/ScreenshotTestsKt
  script:
    # Build host-platform native library so layoutlib can load UniFFI types.
    # Uses the same core ref that produced the published AAR bindings.
    # The self-hosted runner has Rust installed (shared with vauchi/core).
    - |
      AAR_VERSION=$(grep 'vauchi-platform:' app/build.gradle.kts | sed -n 's/.*vauchi-platform:\([0-9.]*\).*/\1/p' | head -1)
      CORE_REF="v${AAR_VERSION:-main}"
      NATIVE_LIB="app/native-host-libs/libvauchi_platform.so"
      VERSION_STAMP="app/native-host-libs/.version"
      # Rebuild if lib missing or version changed.
      # Always clean the cargo target dir on rebuild to prevent stale object
      # files from causing UniFFI API checksum mismatches at runtime.
      if [ -f "$NATIVE_LIB" ] && [ -f "$VERSION_STAMP" ] && [ "$(cat "$VERSION_STAMP")" = "$CORE_REF" ]; then
        echo "✅ Native library cached for ${CORE_REF}: $NATIVE_LIB"
      else
        echo "📦 Building libvauchi_platform.so for host platform (${CORE_REF})..."
        rm -rf "${CI_PROJECT_DIR}/.cargo-target" app/native-host-libs
        mkdir -p app/native-host-libs
        CORE_DIR="${CI_PROJECT_DIR}/.core-checkout"
        rm -rf "$CORE_DIR"
        # Download core source at the exact tag via GitLab API archive.
        # git clone --depth=1 --branch=TAG fails for tags with CI_JOB_TOKEN,
        # and fetch-by-SHA is unreliable. The API archive is always correct.
        ARCHIVE_URL="${CI_SERVER_URL}/api/v4/projects/vauchi%2Fcore/repository/archive.tar.gz?sha=${CORE_REF}"
        mkdir -p "$CORE_DIR"
        if curl -fsSL --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "$ARCHIVE_URL" | tar xz --strip-components=1 -C "$CORE_DIR"; then
          echo "✅ Downloaded core archive at ${CORE_REF}"
        else
          echo "⚠️  Archive download failed for ${CORE_REF} — cloning main"
          rm -rf "$CORE_DIR"
          git clone --depth=1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/vauchi/core.git" "$CORE_DIR"
        fi
        # Clone-or-refresh themes repo — required by include_bytes! in vauchi-platform.
        # Mirrors the clone-if-absent + pull-if-present pattern in
        # scripts/ci-templates/rust-base.yml .clone-themes (can't use the
        # anchor directly because android needs themes at $CI_PROJECT_DIR/themes,
        # not the sibling-of-project path the anchor assumes).
        THEMES_DIR="${CI_PROJECT_DIR}/themes"
        if [ ! -d "$THEMES_DIR" ]; then
          git clone --depth=1 --branch=main \
            "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/vauchi/themes.git" "$THEMES_DIR"
        else
          git -C "$THEMES_DIR" pull --ff-only 2>/dev/null || true
        fi
        python3 "$THEMES_DIR/scripts/generate.py"
        export CARGO_HOME="${CI_PROJECT_DIR}/.cargo-screenshots"
        export CARGO_TARGET_DIR="${CI_PROJECT_DIR}/.cargo-target"
        cargo build -p vauchi-platform --release --manifest-path "$CORE_DIR/Cargo.toml"
        mkdir -p app/native-host-libs
        cp "$CARGO_TARGET_DIR/release/libvauchi_platform.so" "$NATIVE_LIB"
        echo "$CORE_REF" > "$VERSION_STAMP"
        echo "✅ Native library built from ${CORE_REF}: $(ls -lh "$NATIVE_LIB" | awk '{print $5}')"
      fi
    # Self-detecting snapshot mode (pipefail-safe: check dir exists before find)
    - |
      BASELINE_COUNT=0
      if [ -d app/src/screenshotTestDebug/reference ]; then
        BASELINE_COUNT=$(find app/src/screenshotTestDebug/reference -name '*.png' | wc -l | tr -d ' ')
      fi
    - |
      if [ "$BASELINE_COUNT" -eq 0 ]; then
        echo "⚠️  SCREENSHOT BASELINES MISSING ($BASELINE_COUNT PNGs in reference/)"
        echo "    Use the 'Record baselines' manual job in this pipeline to generate them."
        echo "    CI is the single source of truth — do not record locally."
        echo "    Screenshot validation skipped — no baselines to compare against."
        exit 0
      fi
    - echo "✅ Found $BASELINE_COUNT screenshot baselines — running validation"
    - ./gradlew validateDebugScreenshotTest
  after_script:
    - !reference [.vrt-upload-script, script]
  artifacts:
    when: always
    paths:
      - app/build/reports/screenshotTest/
      - app/src/screenshotTestDebug/reference/
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/main
        paths:
          - "**/*.kt"
          - "**/*.java"
          - "build.gradle*"
          - "app/build.gradle*"
          - "gradle.properties"
          - ".gitlab-ci.yml"
    # Run on main too so the committed baselines upload to VRT every merge,
    # matching the other platforms (macos/ios/linux-gtk/linux-qt/web-demo).
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH


# Committed baselines must map to live preview test functions — orphans
# from deleted tests masquerade as current UI (2026-06-11: 17 found).
check:orphan-baselines: # vci02-ok: alpine job intentionally installs its complete tool set
  extends: .check-orphan-baselines
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  before_script:
    - apk add --no-cache bash findutils grep curl
  variables:
    ORPHAN_STYLE: compose
    ORPHAN_BASELINE_ROOT: app/src/screenshotTestDebug/reference/app/vauchi
    ORPHAN_TEST_SRC: app/src/screenshotTest

# Manual job: record screenshot baselines on CI and commit them to the branch.
# CI is the single source of truth for baselines — never record locally.
# Also re-run it when baselines lag main — view changes merged without
# re-recording leave the VRT gallery stale (observed 2026-06-11).
test:snapshots:record:
  extends: [.android-job, .timeout-standard]
  stage: test
  needs: []
  when: manual
  allow_failure: true
  script:
    - echo "📸 Recording screenshot baselines..."
    # Build host-platform native library (same as test:screenshots)
    - |
      AAR_VERSION=$(grep 'vauchi-platform:' app/build.gradle.kts | sed -n 's/.*vauchi-platform:\([0-9.]*\).*/\1/p' | head -1)
      CORE_REF="v${AAR_VERSION:-main}"
      NATIVE_LIB="app/native-host-libs/libvauchi_platform.so"
      VERSION_STAMP="app/native-host-libs/.version"
      if [ -f "$NATIVE_LIB" ] && [ -f "$VERSION_STAMP" ] && [ "$(cat "$VERSION_STAMP")" = "$CORE_REF" ]; then
        echo "✅ Native library cached for ${CORE_REF}: $NATIVE_LIB"
      else
        rm -rf "${CI_PROJECT_DIR}/.cargo-target" app/native-host-libs
        mkdir -p app/native-host-libs
        CORE_DIR="${CI_PROJECT_DIR}/.core-checkout"
        rm -rf "$CORE_DIR"
        # Download core source at the exact tag via GitLab API archive.
        # git clone --depth=1 --branch=TAG fails for tags with CI_JOB_TOKEN,
        # and fetch-by-SHA is unreliable. The API archive is always correct.
        ARCHIVE_URL="${CI_SERVER_URL}/api/v4/projects/vauchi%2Fcore/repository/archive.tar.gz?sha=${CORE_REF}"
        mkdir -p "$CORE_DIR"
        if curl -fsSL --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "$ARCHIVE_URL" | tar xz --strip-components=1 -C "$CORE_DIR"; then
          echo "✅ Downloaded core archive at ${CORE_REF}"
        else
          echo "⚠️  Archive download failed for ${CORE_REF} — cloning main"
          rm -rf "$CORE_DIR"
          git clone --depth=1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/vauchi/core.git" "$CORE_DIR"
        fi
        # Clone-or-refresh themes repo — required by include_bytes! in vauchi-platform.
        # Mirrors the clone-if-absent + pull-if-present pattern in
        # scripts/ci-templates/rust-base.yml .clone-themes (can't use the
        # anchor directly because android needs themes at $CI_PROJECT_DIR/themes,
        # not the sibling-of-project path the anchor assumes).
        THEMES_DIR="${CI_PROJECT_DIR}/themes"
        if [ ! -d "$THEMES_DIR" ]; then
          git clone --depth=1 --branch=main \
            "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/vauchi/themes.git" "$THEMES_DIR"
        else
          git -C "$THEMES_DIR" pull --ff-only 2>/dev/null || true
        fi
        python3 "$THEMES_DIR/scripts/generate.py"
        export CARGO_HOME="${CI_PROJECT_DIR}/.cargo-record"
        export CARGO_TARGET_DIR="${CI_PROJECT_DIR}/.cargo-target"
        cargo build -p vauchi-platform --release --manifest-path "$CORE_DIR/Cargo.toml"
        mkdir -p app/native-host-libs
        cp "$CARGO_TARGET_DIR/release/libvauchi_platform.so" "$NATIVE_LIB"
        echo "$CORE_REF" > "$VERSION_STAMP"
      fi
    - |
      # Namespace /tmp by CI_JOB_ID so concurrent/prior jobs on the same
      # shell runner can't leave files with foreign ownership (EACCES).
      GRADLE_LOG="/tmp/gradle-record-${CI_JOB_ID}.log"
      set +e
      ./gradlew updateDebugScreenshotTest 2>&1 | tee "$GRADLE_LOG"
      GRADLE_EXIT=$?
      set -e
      if [ "$GRADLE_EXIT" -ne 0 ]; then
        echo "❌ Gradle failed (exit code ${GRADLE_EXIT})"
        tail -20 "$GRADLE_LOG"
        exit 1
      fi
      echo "✅ Screenshot recording completed"
    # Fix double-nesting: AGP updateDebugScreenshotTest writes to reference/reference/
    # instead of reference/ — flatten the output to match the expected structure.
    - |
      NESTED="app/src/screenshotTestDebug/reference/reference"
      if [ -d "$NESTED" ]; then
        echo "📂 Flattening double-nested reference directory..."
        cp -a "$NESTED"/. app/src/screenshotTestDebug/reference/
        rm -rf "$NESTED"
      fi
    # Preserve recorded baselines across git checkout (copy CONTENTS, not directory).
    # Per-job dir guards against ownership collisions on the shared shell runner.
    - mkdir -p "/tmp/screenshot-reference-${CI_JOB_ID}" && cp -a app/src/screenshotTestDebug/reference/. "/tmp/screenshot-reference-${CI_JOB_ID}"/
    # Configure git for push via CI_JOB_TOKEN (requires ci_push_repository_for_job_token_allowed)
    - git config user.name "${GITLAB_USER_NAME}"
    - git config user.email "${GITLAB_USER_EMAIL}"
    - git fetch origin "+refs/heads/${CI_COMMIT_REF_NAME}:refs/heads/${CI_COMMIT_REF_NAME}"
    - git checkout -B "${CI_COMMIT_REF_NAME}" FETCH_HEAD
    # Restore recorded baselines (git checkout above resets working directory)
    - mkdir -p app/src/screenshotTestDebug/reference && cp -a "/tmp/screenshot-reference-${CI_JOB_ID}"/. app/src/screenshotTestDebug/reference/
    # Commit and push baselines (skip if unchanged)
    - |
      git add app/src/screenshotTestDebug/reference/
      if git diff --cached --quiet; then
        echo "✅ No baseline changes — nothing to commit"
        exit 0
      fi
      CHANGED=$(git diff --cached --stat | tail -1)
      git commit -m "chore: record screenshot baselines [ci]

      ${CHANGED}

      Co-Authored-By: vauchi-ci-bot <ci@vauchi.app>"
      git push origin HEAD:${CI_COMMIT_REF_NAME}
      echo "✅ Baselines committed and pushed — validation pipeline will trigger"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/main
        paths:
          - "**/*.kt"
          - "**/*.java"
          - "build.gradle*"
          - "app/build.gradle*"
          - "gradle.properties"
          - ".gitlab-ci.yml"

# Debug APK includes unstripped .so (~12 MB each) + debug info → ~60 MB.
# Release AAB is minified + shrunk → ~20 MB.
# Two separate gates keep limits tight for each build type.
gate:app-size:debug:
  extends: .app-size-gate-job
  tags: [linux, self-hosted]
  needs: ["build:debug"]
  variables:
    APP_SIZE_GATE_DIR: "app/build/outputs/apk/debug"
    APP_SIZE_GATE_FORMAT: "apk"
    APP_SIZE_GATE_MAX_BYTES: "73400320"     # 70 MB
    APP_SIZE_GATE_WARN_BYTES: "62914560"    # 60 MB
  # Rules MUST mirror build:debug's changes list: an unconditional MR rule
  # here while build:debug is changes-filtered makes GitLab abort the whole
  # pipeline ("needs 'build:debug', but it does not exist") with ZERO jobs —
  # docs/assets-only MRs become unmergeable, and REST shows no reason (only
  # GraphQL failureReason does). Broke docs:gate's purpose; hit by !526.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/main
        paths:
          - "**/*.kt"
          - "**/*.java"
          - "**/*.xml"
          - "build.gradle*"
          - "app/build.gradle*"
          - ".gitlab-ci.yml"

gate:app-size:release:
  extends: .app-size-gate-job
  tags: [linux, self-hosted]
  needs: ["build:release"]
  variables:
    APP_SIZE_GATE_DIR: "app/build/outputs/bundle/release"
    APP_SIZE_GATE_FORMAT: "aab"
    APP_SIZE_GATE_MAX_BYTES: "31457280"     # 30 MB
    APP_SIZE_GATE_WARN_BYTES: "26214400"    # 25 MB
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# Diagnostic: builds libvauchi_platform.so twice and diffs the binaries.
# Reproducibility is a defence-in-depth signal for supply-chain integrity
# (SLSA L3 alignment), but real reproducible builds across the Android
# NDK toolchain require infrastructure that isn't yet in place
# (timestamp clamping, deterministic linker order, host environment
# hermeticity). allow_failure: true keeps the job advisory until the
# infrastructure work is done. Audited 2026-04-22 T2.5.
verify:reproducible-so:
  extends: [.android-job, .timeout-long]
  stage: test
  needs: []
  allow_failure: true
  variables:
    SOURCE_DATE_EPOCH: "0"
    CARGO_INCREMENTAL: "0"
  script:
    - |
      echo "=== Reproducible .so Build Verification ==="
      export RUSTFLAGS="--remap-path-prefix=${PWD}=/build"

      # Per-job paths guard against ownership collisions on the shared shell runner.
      BUILD1_SO="/tmp/build1-${CI_JOB_ID}.so"
      BUILD2_SO="/tmp/build2-${CI_JOB_ID}.so"

      # Build 1
      echo "Build 1..."
      cargo ndk -t aarch64-linux-android build -p vauchi-platform --release
      cp target/aarch64-linux-android/release/libvauchi_platform.so "$BUILD1_SO"

      # Clean and rebuild
      cargo clean -p vauchi-platform
      echo "Build 2..."
      cargo ndk -t aarch64-linux-android build -p vauchi-platform --release
      cp target/aarch64-linux-android/release/libvauchi_platform.so "$BUILD2_SO"

      # Compare
      HASH1=$(sha256sum "$BUILD1_SO" | cut -d' ' -f1)
      HASH2=$(sha256sum "$BUILD2_SO" | cut -d' ' -f1)

      echo "Build 1: ${HASH1}"
      echo "Build 2: ${HASH2}"

      if [ "$HASH1" = "$HASH2" ]; then
        echo "✓ Builds are reproducible"
      else
        echo "✗ Builds differ — not reproducible"
        exit 1
      fi
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ============================================================
# Security Stage (MR + scheduled)
# ============================================================

# GitLab security templates configuration
# Override child analyzer jobs (not parent stubs) to add tags and rules

semgrep-sast:
  allow_failure: false
  tags: [docker]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/main
        paths:
          - "**/*.kt"
          - "**/*.java"
          - ".gitlab-ci.yml"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Gemnasium for Gradle dependencies
gemnasium-dependency_scanning:
  tags: [docker]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/main
        paths:
          - "build.gradle*"
          - "app/build.gradle*"
          - "gradle.properties"
          - ".gitlab-ci.yml"
    - if: $CI_PIPELINE_SOURCE == "schedule"

secret_detection:
  allow_failure: false
  tags: [docker]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ============================================================
# Deploy Stage (Tag only — upload to Google Play Internal Testing)
# ============================================================

deploy:internal:
  extends: [.android-docker-job, .timeout-long]
  stage: deploy
  interruptible: false
  # Required CI/CD variables (in addition to build:release variables):
  #   GOOGLE_PLAY_SA_JSON - Base64-encoded Play Console service account JSON
  needs:
    - job: build:release
      artifacts: true
  script:
    # Decode keystore — not used for upload, but Gradle evaluates signingConfigs
    # during configuration phase and will fail if storeFile path doesn't exist
    - echo "$ANDROID_KEYSTORE" | base64 -d > /tmp/vauchi-upload.jks
    - export ANDROID_KEYSTORE_PATH=/tmp/vauchi-upload.jks
    # Decode service account credentials for Play Store upload
    - echo "$GOOGLE_PLAY_SA_JSON" | base64 -d > /tmp/play-sa.json
    - export GOOGLE_PLAY_SERVICE_ACCOUNT=/tmp/play-sa.json
    # Upload AAB to internal testing track
    - ./gradlew publishReleaseBundle
  after_script:
    - rm -f /tmp/vauchi-upload.jks /tmp/play-sa.json
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ============================================================
# Performance Stage (main + tags — app size tracking)
# ============================================================

perf:app-size:
  extends: .mobile-size-tracking-job
  tags: [linux, self-hosted]
  needs: ["build:release"]
  variables:
    MOBILE_SIZE_ARTIFACT_DIR: "app/build/outputs/bundle/release"
    MOBILE_SIZE_PLATFORM: "android"
    MOBILE_SIZE_FORMAT: "aab"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ============================================================
# Deploy Stage — Badge Pages
# ============================================================

pages:
  extends: .badges-pages
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always

github-mirror:
  extends: .github-mirror
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
