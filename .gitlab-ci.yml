# ============================================================
# Deploy Stage (Tag only — upload to Google Play Internal Testing)
# ============================================================

deploy:internal:
  extends: [.android-docker-job, .timeout-long]
  stage: deploy
  interruptible: false
  # Required CI/CD variables (in addition to build:release variables):
  #   GOOGLE_PLAY_SA_JSON - Base64-encoded Play Console service account JSON
  needs:
    - job: build:release
      artifacts: true
  script:
    # Decode keystore — not used for upload, but Gradle evaluates signingConfigs
    # during configuration phase and will fail if storeFile path doesn't exist
    - echo "$ANDROID_KEYSTORE" | base64 -d > /tmp/vauchi-upload.jks
    - export ANDROID_KEYSTORE_PATH=/tmp/vauchi-upload.jks
    # Decode service account credentials for Play Store upload
    - echo "$GOOGLE_PLAY_SA_JSON" | base64 -d > /tmp/play-sa.json
    - export GOOGLE_PLAY_SERVICE_ACCOUNT=/tmp/play-sa.json
    # Upload AAB to internal testing track
    - ./gradlew publishReleaseBundle
  after_script:
    - rm -f /tmp/vauchi-upload.jks /tmp/play-sa.json
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

